<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ site.url }}/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta name="theme-color" content="#e6ebe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14211b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c2412d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c2412d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"{{ person.name }}","jobTitle":"{{ person.role }}","email":"mailto:{{ contact.email }}","url":"{{ site.url }}","sameAs":["{{ contact.linkedin }}","{{ contact.github }}"]}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="topbar__name" href="#top">{{ person.name }}</a>
    <nav aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main id="main">
{% block main %}{% endblock %}
  </main>
  <footer class="footer">
    <p>&copy; {{ year }} {{ person.name }}. Built with a small Python generator and served as static HTML.</p>
  </footer>
</body>
</html>
