work:
  - title: Wildlife early-warning platform
    org: Israel Nature and Parks Authority
    facts:
      - "1,282 actively tagged birds"
      - "118.8 million location records, about 56,600 more a day"
      - "About 3 minutes from GPS fix to ranger alert"
    body: >-
      I inherited an outdated prototype and rebuilt it as a horizontally
      scalable pipeline on Celery, RabbitMQ and PostGIS. Twelve telemetry files
      arrive every minute; each fix becomes metrics, behavioural states and
      events such as suspected mortality, suspected poisoning, immobility,
      wind-farm entry and low battery. Alerts go to regional and species ranger
      groups on Telegram. A scenario test suite replays real captured telemetry
      and catches performance regressions before release. Rangers have used the
      alerts to save birds, some more than once, and Italy's national
      environmental institute, ISPRA, now runs its own birds through it.
  - title: Computer vision for camera traps
    org: Israel Nature and Parks Authority
    body: >-
      A gRPC inference service, secured with mutual TLS, that runs the
      MegaDetector model on camera-trap images with species classification and
      people detection, cutting manual image review for field staff.
  - title: Rules and automation engine
    org: Israel Nature and Parks Authority
    body: >-
      A configurable rules engine for the Authority's core observation and
      enforcement platform, a Django monolith of about 130 apps. Nested
      condition groups with lazy evaluation and caching, time-based rules,
      reversible actions and Celery execution let staff automate workflows
      without code changes.
  - title: Planning and permits platform
    org: Israel Nature and Parks Authority
    body: >-
      Tracks development plans and permit applications against protected
      land: integrates with the national permit-licensing API, ingests Office
      365 email, extracts geometry from DWG/DXF and shapefiles, and measures
      development encroachment into ecological corridors.
  - title: 15x faster overnight data transfer
    org: Israel Nature and Parks Authority
    body: >-
      Re-engineered a data-transfer API as a streaming pipeline, cutting its
      runtime from up to 5 hours to 20 minutes.

